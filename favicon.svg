<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b1e" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <!-- Metallic Titanium Gradient -->
    <linearGradient id="favTitanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="favCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Deep 3D Shadow -->
    <linearGradient id="favShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a122c" />
      <stop offset="100%" stop-color="#020512" />
    </linearGradient>

    <!-- Ambient Neon Glow -->
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0, 240, 255, 0.45)" />
    </filter>
  </defs>

  <!-- Base Rounded Container Shield -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#favBg)" stroke="rgba(0, 240, 255, 0.35)" stroke-width="2" />

  <!-- 3D Depth Shadow Facet -->
  <path d="M22 24 L34 24 L34 56 C34 65 41 70 50 70 C59 70 66 65 66 56 L66 40 L78 40 L78 57 C78 72 65 82 50 82 C35 82 22 72 22 57 Z" fill="url(#favShadow)" transform="translate(0, 3)" />

  <!-- The "US" Interlocking Monogram Symbol -->
  <!-- 1. The Outer & Base U-Cradle (Metallic Titanium) -->
  <path d="M22 22 L34 22 L34 57 C34 65 41 69 50 69 C59 69 66 65 66 57 L66 44 L78 44 L78 58 C78 72 65 81 50 81 C35 81 22 72 22 58 Z" fill="url(#favTitanium)" />

  <!-- 2. The Interlocking S-Ribbon (Electric Cyan Glow) -->
  <!-- Top arm of S flowing left from right pillar, cutting through center, and curling over bottom cradle -->
  <path d="M78 22 L44 22 C34 22 28 27 28 35 C28 43 35 46 44 48 L56 50 C65 52 70 55 70 62 C70 70 62 74 52 74 L34 74 L34 65 L50 65 C55 65 58 63 58 60 C58 56 54 54 46 52 L36 50 C26 47 18 42 18 32 C18 22 28 15 42 15 L78 15 Z" fill="url(#favCyan)" filter="url(#favGlow)" />

  <!-- 3. Dynamic Center 3D Specular Node -->
  <circle cx="50" cy="50" r="3.5" fill="#ffffff" />
  <circle cx="50" cy="50" r="7" stroke="rgba(0, 240, 255, 0.6)" stroke-width="1.5" fill="none" />
</svg>